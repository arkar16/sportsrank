name: Portable offline checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Run locked offline checks
    runs-on: ubuntu-latest
    env:
      CFBD_API: ""
      CFBD_API_KEY: ""
      CFBD_PRED_API: ""
    steps:
      - name: Check out the submitted tree
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure runner-local package caches
        shell: bash
        run: |
          set -euo pipefail
          echo "UV_CACHE_DIR=$RUNNER_TEMP/sportsrank-uv-cache" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/sportsrank-uv-cache"

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Determine release-readiness scope
        id: scope
        run: python -m scripts.ci_scope >> "$GITHUB_OUTPUT"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install locked Python dependencies
        run: uv sync --locked

      - name: Run the offline Python suite
        run: uv run --locked python -m unittest discover -s tests -v

      - name: Compile the Python source
        run: uv run --locked python -m compileall -q cfb tools scripts tests

      - name: Verify the reviewed local validation receipt and public site
        if: steps.scope.outputs.release_readiness == 'true'
        run: >-
          uv run --locked python -m cfb.public_site verify
          --receipt config/sr7-local-validation-receipt.json
          --site website
          --firebase-json firebase.json
          --source-root .
          --trusted-input-manifest config/sr7-recovery-inputs.json

      - name: Check static hosting tree
        run: test -f website/index.html && test -f website/404.html
