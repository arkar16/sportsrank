name: Publish static site to Firebase Hosting

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'firebase.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/firebase-hosting-publish.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sportsrank-production-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'arkar16/sportsrank' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://www.sportsrank.top
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Authenticate Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPORTSRANK_837AF }}

      - name: Publish committed website
        run: npx --no-install firebase deploy --only hosting --project sportsrank-837af --non-interactive

      - name: Check updated public pages
        shell: bash
        run: |
          set -euo pipefail
          season_dir=$(find website/cfb/years -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          season=$(basename "$season_dir")
          ranking=$(find "$season_dir/rankings" -name '*_W*_FBS_cors.html' | sort -V | tail -1)
          results=$(find "$season_dir/data/results/weekly_results" -name '*_FBS_results.html' | sort -V | tail -1)
          forecast=$(find "$season_dir/spread" -name '*_W*_FBS_spread.html' | sort -V | tail -1)
          for file in "$season_dir/${season}_CFB.html" "$ranking" "$results" "$forecast" "website/cfb/performance/$season/index.html"; do
            test -s "$file"
            path=${file#website/}
            curl --fail --silent --show-error --location --max-time 15 --retry 2 --retry-delay 2 \
              "https://www.sportsrank.top/$path?publication=$GITHUB_SHA" -o "$RUNNER_TEMP/live-page"
            cmp "$file" "$RUNNER_TEMP/live-page"
            echo "Published: https://www.sportsrank.top/$path"
          done
          echo "Published commit $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
